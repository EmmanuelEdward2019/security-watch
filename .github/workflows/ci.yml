name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets deploy.yml reuse this instead of duplicating the checks, so production
  # can only ship what has already passed verification.
  workflow_call:

# A superseded run on the same branch is wasted compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # Placeholders are enough: the client only reads these at runtime, and
        # lib/supabase.ts throws on the literal "your-project" host, so a real
        # project ref shape is required even for a build.
        env:
          VITE_SUPABASE_URL: https://ciplaceholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_SITE_URL: https://thesecuritywatch.com
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the job on a high or critical advisory. Moderate findings are
      # reported but do not block, so a transitive dev-only advisory cannot stop
      # a security fix from shipping.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    # A live Resend key sat in EMAIL_SPAM_FIX.md from 22 April until 4 August,
    # in every commit, until GitHub's scanning caught it and Resend revoked it.
    # A hand-written audit missed it because the regex used [A-Za-z0-9] and the
    # key contains an underscore. This job exists so that detection never again
    # depends on someone writing the right character class by hand.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the tip

      # Non-blocking: gitleaks-action needs a licence key for organisation-owned
      # repositories, and a licensing change must not be able to stop a security
      # fix from shipping. The explicit check below is the one that gates.
      - name: Scan working tree and full history
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: an explicit check for the credential shapes this
      # project actually uses, in case a gitleaks rule ever stops matching.
      #
      # This scans EVERY commit, not just the checked-out tree. The tree-only
      # version missed the second Resend flag completely: the key had been
      # redacted at HEAD, so `git grep` on the checkout came back clean while
      # fifteen historical commits still carried it. GitHub scans what you
      # push, not what your tip happens to look like.
      - name: Project-specific credential patterns
        run: |
          # Deliberately permissive character classes — the original miss was
          # caused by omitting _ and - from them.
          # Resend keys are re_<8 alphanumerics>_<20+ alphanumerics>. Matching
          # the underscore position precisely avoids firing on filenames like
          # 011_restore_policy_predicate_grants.sql, while still catching the
          # real thing — which is exactly what the first hand-written scan got
          # wrong in the other direction.
          PATTERN='re_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'

          # Documented placeholders, which are intentional and must not fail CI.
          IGNORE='re_xxx|sk_live_xxx|sk_test_xxx|whsec_xxx|<RESEND_API_KEY>|your-.*-key|REDACTED|YOUR_PROJECT_REF'

          # package-lock is excluded because npm integrity hashes are base64 and
          # collide with the JWT shape.
          if git grep -lIE "$PATTERN" $(git rev-list --all) -- \
               ':!*.lock' ':!package-lock.json' 2>/dev/null \
             | grep -vE "$IGNORE" | head -20 | grep .; then
            echo "::error::A credential-shaped string exists somewhere in this repository's history."
            echo "Redacting it at HEAD is not enough - GitHub scans every pushed commit."
            echo "Rotate the credential, then purge it with:"
            echo "  git filter-repo --replace-text <(echo 'THEKEY==>***REDACTED***')"
            echo "and force-push. See SECURITY.md."
            exit 1
          fi
          echo "No credential-shaped strings in any commit."

  sql-sanity:
    name: Migration sanity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Catches the two mistakes that would silently reopen the holes closed in
      # migration 004: a new table without RLS, and a SECURITY DEFINER function
      # without a pinned search_path.
      - name: Every new table enables RLS
        run: |
          missing=0
          for file in supabase/migrations/*.sql; do
            while IFS= read -r table; do
              if ! grep -q "ALTER TABLE public.${table} ENABLE ROW LEVEL SECURITY" supabase/migrations/*.sql; then
                echo "::error file=${file}::Table public.${table} is created but never has RLS enabled"
                missing=1
              fi
            done < <(grep -oE 'CREATE TABLE (IF NOT EXISTS )?public\.[a-z_]+' "$file" \
                      | sed -E 's/.*public\.//' | sort -u)
          done
          exit $missing

      - name: Every SECURITY DEFINER function pins search_path
        # Two earlier versions of this check were wrong in opposite directions.
        #
        # Counting "SECURITY DEFINER" lines against "SET search_path" lines per
        # file reported 001, 004, 010 and 011 as failures purely because those
        # files mention the phrase in a comment — the job had been red long
        # enough to be ignored, which is worse than having no check.
        #
        # Parsing only the function header then missed migration 001 entirely,
        # because 001 writes `$$ LANGUAGE plpgsql SECURITY DEFINER;` after the
        # body rather than before it. That is a false negative on the exact
        # class of bug this job exists to catch.
        #
        # This version parses whole definitions, inspects header and trailer,
        # and resolves each function to its final CREATE OR REPLACE so that a
        # function defined unsafely in 001 and corrected in 004 is not reported.
        run: |
          python3 - <<'CHECK'
          import glob, re, sys

          # A definition is: CREATE ... FUNCTION name(args) <header> AS $$ body $$ <trailer> ;
          # SECURITY DEFINER and SET search_path may appear in EITHER the header or the
          # trailer -- migration 001 uses the trailer form, which an earlier version of
          # this check never inspected.
          DEF = re.compile(
              r"CREATE\s+(?:OR\s+REPLACE\s+)?FUNCTION\s+(?P<name>[\w.]+)\s*\("
              r"(?P<header>.*?)AS\s*(?P<tag>\$[a-zA-Z_]*\$)"
              r"(?P<body>.*?)(?P=tag)(?P<trailer>[^;]*);",
              re.IGNORECASE | re.DOTALL,
          )

          # Last definition wins: production reflects the final CREATE OR REPLACE, so a
          # function defined unsafely in 001 and corrected in 004 is not a live finding.
          final = {}
          for path in sorted(glob.glob("supabase/migrations/*.sql")):
              raw = open(path, encoding="utf-8").read()
              body = "\n".join(l for l in raw.splitlines() if not l.lstrip().startswith("--"))
              for m in DEF.finditer(body):
                  decl = m.group("header") + " " + m.group("trailer")
                  name = m.group("name").split(".")[-1].lower()
                  final[name] = (path, decl)

          failures = [
              (path, name)
              for name, (path, decl) in final.items()
              if re.search(r"SECURITY\s+DEFINER", decl, re.I)
              and not re.search(r"SET\s+search_path", decl, re.I)
          ]

          for path, name in sorted(failures):
              print(f"::error file={path}::{name}() is SECURITY DEFINER without SET search_path")

          print(f"Checked {len(final)} functions.")
          if failures:
              sys.exit(1)
          print("Every live SECURITY DEFINER function pins search_path.")
          CHECK
